# Compiles the standalone Windows version of TimeShot 2 with Nuitka (packaging/nuitka/build.py),
# smoke-tests it end to end with synthetic cameras, and keeps the zip as a workflow artifact
# (Actions tab > the run > Artifacts). Also runnable by hand: Actions > this workflow > Run.

name: Build TimeShot 2 (Windows)

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/build-windows.yml"
      - "packaging/nuitka/**"
      - "pyproject.toml"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: Build windows-x64
    runs-on: windows-latest
    # A cold Nuitka build takes 10-20 minutes; also bounds a job stuck waiting for a runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/nuitka/requirements.txt
      - name: Install build dependencies
        run: |
          pip install -r packaging/nuitka/requirements.txt
          pip install --no-deps .
      - name: Compile with Nuitka
        id: build
        run: python packaging/nuitka/build.py
      - name: Keep crash dumps of TimeShot
        # Windows Error Reporting then writes a minidump of any TimeShot process that crashes
        # (recorder processes included); "Show where TimeShot crashed" reads them.
        run: |
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\TimeShot.exe"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value "$env:RUNNER_TEMP\crash-dumps" -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null # minidump
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 4 -Force | Out-Null
          Set-Service WerSvc -StartupType Manual
          Start-Service WerSvc
      - name: Smoke-test the executable
        run: python packaging/nuitka/smoke_test.py "${{ steps.build.outputs.executable }}"
      - name: Show where TimeShot crashed
        if: failure()
        run: |
          $dumps = @(Get-ChildItem "$env:RUNNER_TEMP\crash-dumps" -Filter *.dmp -ErrorAction SilentlyContinue)
          if ($dumps.Count -eq 0) { "No crash dumps were written."; exit 0 }
          # Installed on the Windows Server 2025 runner image (Windows SDK debugging tools).
          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) { "cdb.exe is not installed; the dumps are in the crash-dumps artifact."; exit 0 }
          $dist = Split-Path "${{ steps.build.outputs.executable }}"
          $symbols = "srv*$env:RUNNER_TEMP\symbols*https://msdl.microsoft.com/download/symbols;$dist"
          foreach ($dump in $dumps) {
            "===== $($dump.Name) ====="
            # The exception and its stack first; then the debugger's analysis (fast-fail kind, faulting module).
            & $cdb -z $dump.FullName -i $dist -y $symbols -lines -c ".ecxr; kn 40; !analyze -v; q"
          }
      - name: Upload the crash dumps
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: crash-dumps-windows-x64
          path: ${{ runner.temp }}/crash-dumps
          if-no-files-found: ignore
      - name: Upload the zip
        uses: actions/upload-artifact@v6
        with:
          name: TimeShot-${{ steps.build.outputs.version }}-windows-x64
          path: ${{ steps.build.outputs.archive }}
          if-no-files-found: error
          compression-level: 0 # already compressed
      - name: Upload Nuitka's report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: nuitka-report-windows-x64
          path: build/compilation-report.xml
          if-no-files-found: ignore
