# Checks TimeShot 2.0 (the Python app in src/timeshot) on every platform it supports:
# lint, formatting, types, and the test suite, which records from synthetic cameras through
# the real recorder processes, LSL streams and video writer, and drives the GUI offscreen.

name: Tests

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/tests.yml"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/tests.yml"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-22.04
          - name: macos-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        # PySide6 needs these even offscreen; minimal runner images do not always ship them.
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Types
        run: mypy
      - name: Tests
        run: pytest -q
